<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFF7EC">
    <title>Hệ thống ảnh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFF7EC;
            --card: #FFFFFF;
            --text: #3B2F2A;
            --muted: #8C7B70;
            --line: #EDE1D1;
            --coral: #FF7A5C;
            --coral-ink: #DC4433;
            --coral-deep: #C23826;
            --sun: #FFC94A;
            --sky: #7CC6F2;
            --mint: #86D9B6;
            --pink: #FFADC4;
            --error: #CF3B2B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--text);
            background:
                radial-gradient(620px 420px at 8% 4%, rgba(255, 201, 74, 0.35), transparent 65%),
                radial-gradient(560px 420px at 96% 12%, rgba(255, 173, 196, 0.35), transparent 65%),
                radial-gradient(700px 520px at 85% 105%, rgba(124, 198, 242, 0.32), transparent 62%),
                radial-gradient(520px 420px at 0% 100%, rgba(134, 217, 182, 0.32), transparent 62%),
                var(--bg);
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            overflow-x: hidden;
        }

        /* Giấy chấm bi nhẹ như trang sổ lưu niệm */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(rgba(140, 110, 80, 0.16) 1px, transparent 1.2px);
            background-size: 22px 22px;
            mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,0.4) 100%);
            -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,0.4) 100%);
        }

        /* Lấp lánh trang trí */
        .sparkle {
            position: fixed;
            pointer-events: none;
            width: 22px;
            height: 22px;
            animation: twinkle 3.2s ease-in-out infinite;
        }
        .sparkle svg { width: 100%; height: 100%; display: block; }
        .sparkle.s1 { top: 9%;  left: 7%;  color: var(--sun);  }
        .sparkle.s2 { top: 16%; right: 9%; color: var(--pink); width: 16px; height: 16px; animation-delay: 0.8s; }
        .sparkle.s3 { bottom: 12%; left: 12%; color: var(--sky); width: 14px; height: 14px; animation-delay: 1.6s; }
        .sparkle.s4 { bottom: 8%; right: 14%; color: var(--coral); width: 18px; height: 18px; animation-delay: 2.2s; }

        @keyframes twinkle {
            0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.55; }
            50%      { transform: scale(1.15) rotate(20deg); opacity: 1; }
        }

        .page {
            position: relative;
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            align-items: center;
            gap: 56px;
        }

        /* --- Chồng ảnh polaroid --- */
        .stack {
            position: relative;
            height: 440px;
        }

        .frame {
            position: absolute;
            background: #fff;
            padding: 12px 12px 46px;
            border-radius: 4px;
            box-shadow: 0 22px 44px rgba(150, 100, 60, 0.18), 0 2px 6px rgba(150, 100, 60, 0.12);
            transform: rotate(var(--r));
            animation: settle 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        /* Băng dính washi */
        .frame::before {
            content: "";
            position: absolute;
            top: -13px;
            left: 50%;
            width: 88px;
            height: 26px;
            transform: translateX(-50%) rotate(var(--tape-r, -4deg));
            background: var(--tape);
            opacity: 0.85;
            border-radius: 2px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 6px, transparent 6px 12px);
        }

        .frame .pic {
            width: 100%;
            height: 100%;
            border-radius: 2px;
        }

        .frame .cap {
            position: absolute;
            left: 0; right: 0; bottom: 9px;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 1.3rem;
            color: #7A6558;
        }

        .frame:nth-child(1) {
            width: 230px; height: 286px;
            left: 0; top: 52px;
            --r: -9deg;
            --tape: var(--pink);
            animation-delay: 0.05s;
        }
        .frame:nth-child(1) .pic {
            background:
                radial-gradient(circle at 68% 34%, #FFF3B0 0 11%, #FFE07A 12%, transparent 13%),
                linear-gradient(180deg, transparent 72%, #FFB3A1 72%, #FF9C8A 100%),
                linear-gradient(180deg, #FFE3B8 0%, #FFC0A8 55%, #FFB3C7 100%);
        }

        .frame:nth-child(1) .cap { text-align: left; padding-left: 22px; }

        .frame:nth-child(2) {
            width: 252px; height: 306px;
            left: 128px; top: 92px;
            --r: 6deg;
            --tape: var(--sky);
            --tape-r: 5deg;
            animation-delay: 0.18s;
        }
        .frame:nth-child(2) .pic {
            background:
                radial-gradient(circle at 22% 24%, #fff 0 5%, transparent 5.5%),
                radial-gradient(circle at 28% 22%, #fff 0 6%, transparent 6.5%),
                linear-gradient(180deg, transparent 74%, #FFE6AE 74%, #FFD98A 100%),
                linear-gradient(180deg, transparent 52%, #58C3E0 52%, #3AA8CC 74%),
                linear-gradient(180deg, #CFEFFF 0%, #A6DDFB 52%);
        }

        .frame:nth-child(3) {
            width: 204px; height: 252px;
            left: 46px; top: 0;
            --r: -2deg;
            --tape: var(--sun);
            --tape-r: -7deg;
            animation-delay: 0.31s;
        }
        .frame:nth-child(3) .pic {
            background:
                radial-gradient(circle at 24% 78%, #FF8FAE 0 4%, transparent 4.5%),
                radial-gradient(circle at 52% 84%, #FFC94A 0 4%, transparent 4.5%),
                radial-gradient(circle at 76% 76%, #FF8FAE 0 4%, transparent 4.5%),
                radial-gradient(ellipse at 50% 125%, #7CCF7A 0 52%, transparent 53%),
                linear-gradient(180deg, #E9F8FF 0%, #D6F2E4 100%);
        }

        @keyframes settle {
            from { opacity: 0; transform: translateY(36px) rotate(calc(var(--r) * 2.2)); }
            to   { opacity: 1; transform: translateY(0) rotate(var(--r)); }
        }

        /* --- Khối đăng nhập --- */
        .panel {
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(237, 225, 209, 0.9);
            border-radius: 26px;
            padding: 36px 34px 34px;
            box-shadow: 0 30px 60px rgba(150, 100, 60, 0.14), 0 2px 8px rgba(150, 100, 60, 0.06);
            animation: rise 0.7s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: none; }
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #9A5B1E;
            background: #FFF0C7;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 14px;
        }
        .eyebrow svg { width: 14px; height: 14px; color: var(--coral); }

        .panel h1 {
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: clamp(2.9rem, 6.5vw, 3.9rem);
            line-height: 1;
            color: var(--text);
            margin-bottom: 12px;
        }
        .panel h1 .accent {
            background: linear-gradient(90deg, var(--coral-ink), #E8578A);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .panel .lead {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 28px;
            max-width: 34ch;
        }

        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #6E5D52;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .field input {
            width: 100%;
            padding: 14px 16px;
            font: inherit;
            font-size: 1rem;
            color: var(--text);
            background: #FFFDF9;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .field input::placeholder { color: #B9A99C; }

        .field input:hover { border-color: #E2D1BC; }

        .field input:focus {
            outline: none;
            background: #fff;
            border-color: var(--coral);
            box-shadow: 0 0 0 4px rgba(255, 122, 92, 0.18);
        }

        .toggle-pass {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #FFF1EC;
            border: none;
            color: var(--coral-ink);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-pass:hover { background: #FFE3DA; }
        .toggle-pass:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

        #password { padding-right: 76px; }

        #error-message {
            display: none;
            color: var(--error);
            background: #FFF0EE;
            border: 1px solid #FFD3CC;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.92rem;
            line-height: 1.5;
            margin: -2px 0 18px;
        }

        .btn-submit {
            width: 100%;
            margin-top: 6px;
            padding: 15px 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            background: var(--coral-ink);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(220, 68, 51, 0.28);
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        .btn-submit svg { width: 18px; height: 18px; transition: transform 0.2s; }
        .btn-submit:hover { background: var(--coral-deep); box-shadow: 0 12px 26px rgba(220, 68, 51, 0.34); }
        .btn-submit:hover svg { transform: translateX(3px); }
        .btn-submit:active { transform: translateY(1px); }
        .btn-submit:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

        .shake { animation: shake 0.32s ease; }
        @keyframes shake {
            25% { transform: translateX(7px); }
            50% { transform: translateX(-7px); }
            75% { transform: translateX(4px); }
        }

        @media (max-width: 760px) {
            body { place-items: start center; padding: 24px 16px 32px; }
            .page { grid-template-columns: 1fr; gap: 22px; max-width: 440px; }
            .stack { height: 230px; }
            .frame { padding: 7px 7px 28px; }
            .frame::before { width: 54px; height: 16px; top: -8px; }
            .frame .cap { font-size: 0.95rem; bottom: 5px; }
            .frame:nth-child(1) .cap { padding-left: 14px; }
            .frame:nth-child(1) { width: 128px; height: 160px; left: 6%;  top: 40px; }
            .frame:nth-child(2) { width: 140px; height: 172px; left: 44%; top: 48px; }
            .frame:nth-child(3) { width: 116px; height: 144px; left: 24%; top: 4px; }
            .panel { padding: 28px 22px 24px; border-radius: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .frame, .shake, .panel, .sparkle { animation: none; }
        }
    </style>
</head>

<body>
    <span class="sparkle s1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.7 6.3 5 10.6 12 12-7 1.4-11.3 5.7-12 12-.7-6.3-5-10.6-12-12 7-1.4 11.3-5.7 12-12z"/></svg></span>
    <span class="sparkle s2" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.7 6.3 5 10.6 12 12-7 1.4-11.3 5.7-12 12-.7-6.3-5-10.6-12-12 7-1.4 11.3-5.7 12-12z"/></svg></span>
    <span class="sparkle s3" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.7 6.3 5 10.6 12 12-7 1.4-11.3 5.7-12 12-.7-6.3-5-10.6-12-12 7-1.4 11.3-5.7 12-12z"/></svg></span>
    <span class="sparkle s4" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.7 6.3 5 10.6 12 12-7 1.4-11.3 5.7-12 12-.7-6.3-5-10.6-12-12 7-1.4 11.3-5.7 12-12z"/></svg></span>

    <main class="page">
        <div class="stack" aria-hidden="true">
            <div class="frame"><div class="pic"></div><span class="cap">mùa hè</span></div>
            <div class="frame"><div class="pic"></div><span class="cap">biển xanh</span></div>
            <div class="frame"><div class="pic"></div><span class="cap">nụ cười</span></div>
        </div>

        <section class="panel">
            <span class="eyebrow">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.6 0 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>
                Góc kí ức của nhóm
            </span>
            <h1>Hệ thống <span class="accent">ảnh</span></h1>
            <p class="lead">Album riêng của nhóm. Đăng nhập để xem lại những khoảnh khắc và thêm ảnh mới.</p>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Ví dụ: trinh" autocomplete="off" autocapitalize="off" spellcheck="false" required>
                </div>

                <div class="field">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrap">
                        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Hiện mật khẩu">Hiện</button>
                    </div>
                </div>

                <div id="error-message" role="alert">Sai tên đăng nhập hoặc mật khẩu. Kiểm tra lại rồi thử lần nữa.</div>

                <button type="submit" class="btn-submit">
                    Xem ảnh
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </form>
        </section>
    </main>

    <script>
        // --- Chức năng đăng nhập ---
        const validAccounts = {
            "trinh": "2004",
            "ly": "2008",
            "hanh": "2009",
            "huan": "2006",
            "su": "2008"
        };

        const form = document.getElementById("login-form");
        const errorMessage = document.getElementById("error-message");
        const passInput = document.getElementById("password");
        const togglePass = document.getElementById("togglePass");

        togglePass.addEventListener("click", () => {
            const hidden = passInput.type === "password";
            passInput.type = hidden ? "text" : "password";
            togglePass.textContent = hidden ? "Ẩn" : "Hiện";
            togglePass.setAttribute("aria-label", hidden ? "Ẩn mật khẩu" : "Hiện mật khẩu");
        });

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim().toLowerCase();
            const password = passInput.value;

            if (validAccounts[username] && validAccounts[username] === password) {
                window.location.href = "hinhanh.html";
            } else {
                errorMessage.style.display = "block";
                form.classList.remove("shake");
                void form.offsetWidth;
                form.classList.add("shake");
            }
        });

        [document.getElementById("username"), passInput].forEach(el =>
            el.addEventListener("input", () => errorMessage.style.display = "none")
        );
    </script>
</body>

</html>
