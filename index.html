<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFF7EC">
    <title>Hệ thống ảnh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFF7EC;
            --text: #3B2F2A;
            --muted: #8C7B70;
            --line: #EDE1D1;
            --coral: #FF7A5C;
            --coral-ink: #DC4433;
            --coral-deep: #C23826;
            --sun: #FFC94A;
            --sky: #7CC6F2;
            --mint: #86D9B6;
            --pink: #FFADC4;
            --wood: #C99A6B;
            --error: #CF3B2B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { min-height: 100%; }

        body {
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--text);
            background:
                linear-gradient(180deg, #DDF1FF 0%, #FFF1E0 46%, var(--bg) 70%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Mặt trời & mây trang trí */
        .sky-deco {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 86% 9%, #FFE27A 0 46px, rgba(255, 210, 90, 0.35) 47px, transparent 120px),
                radial-gradient(70px 26px at 14% 12%, #fff 98%, transparent),
                radial-gradient(46px 22px at 19% 9%, #fff 98%, transparent),
                radial-gradient(60px 22px at 70% 20%, rgba(255,255,255,0.9) 98%, transparent),
                radial-gradient(38px 18px at 74% 17%, rgba(255,255,255,0.9) 98%, transparent);
        }

        /* Cỏ hoa ở chân trang */
        .meadow {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 90px;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 8% 40%, #FF8FAE 0 5px, transparent 6px),
                radial-gradient(circle at 21% 55%, #FFC94A 0 4px, transparent 5px),
                radial-gradient(circle at 37% 45%, #FF8FAE 0 4px, transparent 5px),
                radial-gradient(circle at 63% 52%, #FFC94A 0 5px, transparent 6px),
                radial-gradient(circle at 79% 42%, #FF8FAE 0 4px, transparent 5px),
                radial-gradient(circle at 93% 56%, #FFC94A 0 4px, transparent 5px),
                radial-gradient(120% 100% at 50% 100%, #BDE8A8 0 58%, transparent 59%);
            opacity: 0.8;
        }

        /* --- Dây phơi ảnh --- */
        .clothesline {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1040px;
            height: 268px;
            margin-top: 4px;
            flex-shrink: 0;
        }

        .clothesline .rope {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100px;
            overflow: visible;
        }

        .hang {
            position: absolute;
            left: var(--x);
            top: calc(var(--y) * 1px - 6px);
            transform: translateX(-50%);
        }

        .polaroid {
            position: relative;
            width: 150px;
            height: 184px;
            background: #fff;
            padding: 9px 9px 36px;
            border-radius: 3px;
            box-shadow: 0 16px 30px rgba(120, 90, 60, 0.18), 0 2px 5px rgba(120, 90, 60, 0.12);
            transform-origin: 50% -6px;
            transform: rotate(var(--r, 0deg));
            animation: sway 4.5s ease-in-out infinite alternate, drop 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            animation-delay: var(--d, 0s), calc(var(--d, 0s) * 0.3);
        }

        /* Kẹp gỗ */
        .polaroid::before {
            content: "";
            position: absolute;
            top: -14px;
            left: 50%;
            width: 12px;
            height: 30px;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #B98757 0 45%, #A87648 45% 55%, #D3A677 55%);
            border-radius: 3px;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.15);
        }

        .polaroid .pic { width: 100%; height: 100%; border-radius: 2px; }

        .polaroid .cap {
            position: absolute;
            left: 0; right: 0; bottom: 6px;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 1.15rem;
            color: #7A6558;
        }

        @keyframes sway {
            from { transform: rotate(calc(var(--r, 0deg) - 2.5deg)); }
            to   { transform: rotate(calc(var(--r, 0deg) + 2.5deg)); }
        }
        @keyframes drop {
            from { opacity: 0; translate: 0 -40px; }
            to   { opacity: 1; translate: 0 0; }
        }

        /* Vị trí theo đường cong của dây: y = 30 + 120·t·(1 − t) */
        .h1 { --x: 10%; --y: 41; }
        .h2 { --x: 30%; --y: 55; }
        .h3 { --x: 50%; --y: 60; }
        .h4 { --x: 70%; --y: 55; }
        .h5 { --x: 90%; --y: 41; }

        .h1 .polaroid { --r: -4deg; --d: 0s; }
        .h2 .polaroid { --r: 3deg;  --d: 0.6s; }
        .h3 .polaroid { --r: -2deg; --d: 1.2s; }
        .h4 .polaroid { --r: 4deg;  --d: 0.3s; }
        .h5 .polaroid { --r: -3deg; --d: 0.9s; }

        .h1 .pic { /* hoàng hôn */
            background:
                radial-gradient(circle at 50% 62%, #FFF0A8 0 14%, transparent 15%),
                linear-gradient(180deg, transparent 66%, #FF9C8A 66%, #F98AA0 100%),
                linear-gradient(180deg, #FFE3B8 0%, #FFC0A8 60%);
        }
        .h2 .pic { /* biển */
            background:
                linear-gradient(180deg, transparent 74%, #FFE6AE 74%, #FFD98A 100%),
                linear-gradient(180deg, transparent 50%, #58C3E0 50%, #3AA8CC 74%),
                linear-gradient(180deg, #CFEFFF 0%, #A6DDFB 50%);
        }
        .h3 .pic { /* bánh sinh nhật */
            background:
                radial-gradient(circle at 50% 26%, #FFC94A 0 4%, transparent 4.5%),
                linear-gradient(90deg, transparent 48%, #FF8FAE 48% 52%, transparent 52%) 0 0 / 100% 40% no-repeat,
                linear-gradient(180deg, transparent 40%, #FFF 40% 48%, #FFB3C7 48% 70%, #FFF 70% 74%, #FF8FAE 74% 90%, transparent 90%) 50% 0 / 64% 100% no-repeat,
                linear-gradient(180deg, #FFF6D8, #FFE9B8);
        }
        .h4 .pic { /* đồi hoa */
            background:
                radial-gradient(circle at 24% 80%, #FF8FAE 0 4%, transparent 4.5%),
                radial-gradient(circle at 52% 86%, #FFC94A 0 4%, transparent 4.5%),
                radial-gradient(circle at 76% 78%, #FF8FAE 0 4%, transparent 4.5%),
                radial-gradient(ellipse at 30% 130%, #7CCF7A 0 60%, transparent 61%),
                radial-gradient(ellipse at 85% 120%, #9BDB8A 0 50%, transparent 51%),
                linear-gradient(180deg, #E9F8FF 0%, #D6F2E4 100%);
        }
        .h5 .pic { /* bầu trời đêm sao */
            background:
                radial-gradient(circle at 70% 28%, #FFF3B0 0 10%, transparent 11%),
                radial-gradient(circle at 25% 20%, #fff 0 2%, transparent 2.5%),
                radial-gradient(circle at 40% 48%, #fff 0 1.6%, transparent 2%),
                radial-gradient(circle at 82% 60%, #fff 0 1.6%, transparent 2%),
                linear-gradient(180deg, #9CA9F2 0%, #C6B6F2 60%, #F2C6E0 100%);
        }

        /* --- Thẻ đăng nhập ở giữa --- */
        .page {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 20px 110px;
        }

        .panel {
            position: relative;
            width: 100%;
            max-width: 430px;
            background: #fff;
            border-radius: 28px;
            padding: 40px 34px 30px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(150, 100, 60, 0.16), 0 2px 8px rgba(150, 100, 60, 0.06);
            animation: rise 0.7s 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        /* Băng dính giữ thẻ */
        .panel::before,
        .panel::after {
            content: "";
            position: absolute;
            top: -12px;
            width: 92px;
            height: 26px;
            opacity: 0.85;
            border-radius: 2px;
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.4) 0 6px, transparent 6px 12px);
        }
        .panel::before { left: 26px; transform: rotate(-6deg); background-color: var(--sun); }
        .panel::after  { right: 26px; transform: rotate(5deg); background-color: var(--mint); }

        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: none; }
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #9A5B1E;
            background: #FFF0C7;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .eyebrow svg { width: 14px; height: 14px; color: var(--coral); }

        .panel h1 {
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: clamp(2.8rem, 9vw, 3.5rem);
            line-height: 1;
            color: var(--text);
            margin-bottom: 10px;
        }
        .panel h1 .accent { color: var(--coral-ink); }

        .panel .lead {
            color: var(--muted);
            font-size: 0.98rem;
            line-height: 1.6;
            margin: 0 auto 26px;
            max-width: 32ch;
        }

        form { text-align: left; }

        .field { margin-bottom: 16px; }

        .field label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #6E5D52;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .input-wrap .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            width: 18px;
            height: 18px;
            transform: translateY(-50%);
            color: #C2A995;
            pointer-events: none;
        }

        .field input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            font: inherit;
            font-size: 1rem;
            color: var(--text);
            background: #FFF9F2;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .field input::placeholder { color: #B9A99C; }
        .field input:hover { border-color: #E2D1BC; }
        .field input:focus {
            outline: none;
            background: #fff;
            border-color: var(--coral);
            box-shadow: 0 0 0 4px rgba(255, 122, 92, 0.18);
        }

        .toggle-pass {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #FFF1EC;
            border: none;
            color: var(--coral-ink);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-pass:hover { background: #FFE3DA; }
        .toggle-pass:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

        #password { padding-right: 76px; }

        #error-message {
            display: none;
            color: var(--error);
            background: #FFF0EE;
            border: 1px solid #FFD3CC;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.92rem;
            line-height: 1.5;
            margin: 0 0 16px;
        }

        .btn-submit {
            width: 100%;
            margin-top: 6px;
            padding: 15px 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            background: var(--coral-ink);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(220, 68, 51, 0.28);
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        .btn-submit svg { width: 18px; height: 18px; transition: transform 0.2s; }
        .btn-submit:hover { background: var(--coral-deep); box-shadow: 0 12px 26px rgba(220, 68, 51, 0.34); }
        .btn-submit:hover svg { transform: translateX(3px); }
        .btn-submit:active { transform: translateY(1px); }
        .btn-submit:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

        .foot-note {
            margin-top: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.2rem;
            font-weight: 600;
            color: #A08B7C;
        }

        .shake { animation: shake 0.32s ease; }
        @keyframes shake {
            25% { transform: translateX(7px); }
            50% { transform: translateX(-7px); }
            75% { transform: translateX(4px); }
        }

        @media (max-width: 760px) {
            .clothesline { height: 200px; }
            .polaroid { width: 96px; height: 120px; padding: 6px 6px 24px; }
            .polaroid::before { width: 9px; height: 22px; top: -10px; }
            .polaroid .cap { font-size: 0.85rem; bottom: 4px; }
            .h1, .h5 { display: none; }
            .h2 { --x: 20%; --y: 49; }
            .h3 { --x: 50%; --y: 60; }
            .h4 { --x: 80%; --y: 49; }
            .page { padding: 0 16px 90px; }
            .panel { padding: 34px 22px 24px; border-radius: 24px; }
            .meadow { height: 64px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .polaroid, .shake, .panel { animation: none; }
        }
    </style>
</head>

<body>
    <div class="sky-deco" aria-hidden="true"></div>
    <div class="meadow" aria-hidden="true"></div>

    <div class="clothesline" aria-hidden="true">
        <svg class="rope" viewBox="0 0 1000 100" preserveAspectRatio="none">
            <path d="M0 30 Q500 90 1000 30" fill="none" stroke="#B48A63" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="hang h1"><div class="polaroid"><div class="pic"></div><span class="cap">hoàng hôn</span></div></div>
        <div class="hang h2"><div class="polaroid"><div class="pic"></div><span class="cap">biển xanh</span></div></div>
        <div class="hang h3"><div class="polaroid"><div class="pic"></div><span class="cap">sinh nhật</span></div></div>
        <div class="hang h4"><div class="polaroid"><div class="pic"></div><span class="cap">mùa hè</span></div></div>
        <div class="hang h5"><div class="polaroid"><div class="pic"></div><span class="cap">đêm sao</span></div></div>
    </div>

    <main class="page">
        <section class="panel">
            <span class="eyebrow">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.6 0 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>
                Góc kí ức của nhóm
            </span>
            <h1>Hệ thống <span class="accent">ảnh</span></h1>
            <p class="lead">Album riêng của nhóm. Đăng nhập để xem lại những khoảnh khắc và thêm ảnh mới.</p>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="username">Tên đăng nhập</label>
                    <div class="input-wrap">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
                        <input type="text" id="username" placeholder="Ví dụ: trinh" autocomplete="off" autocapitalize="off" spellcheck="false" required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrap">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Hiện mật khẩu">Hiện</button>
                    </div>
                </div>

                <div id="error-message" role="alert">Sai tên đăng nhập hoặc mật khẩu. Kiểm tra lại rồi thử lần nữa.</div>

                <button type="submit" class="btn-submit">
                    Mở album
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </form>

            <p class="foot-note">lưu giữ từng khoảnh khắc ♡</p>
        </section>
    </main>

    <script>
        // --- Chức năng đăng nhập ---
        const validAccounts = {
            "trinh": "2004",
            "ly": "2008",
            "hanh": "2009",
            "huan": "2006",
            "su": "2008"
        };

        const form = document.getElementById("login-form");
        const errorMessage = document.getElementById("error-message");
        const passInput = document.getElementById("password");
        const togglePass = document.getElementById("togglePass");

        togglePass.addEventListener("click", () => {
            const hidden = passInput.type === "password";
            passInput.type = hidden ? "text" : "password";
            togglePass.textContent = hidden ? "Ẩn" : "Hiện";
            togglePass.setAttribute("aria-label", hidden ? "Ẩn mật khẩu" : "Hiện mật khẩu");
        });

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim().toLowerCase();
            const password = passInput.value;

            if (validAccounts[username] && validAccounts[username] === password) {
                window.location.href = "hinhanh.html";
            } else {
                errorMessage.style.display = "block";
                form.classList.remove("shake");
                void form.offsetWidth;
                form.classList.add("shake");
            }
        });

        [document.getElementById("username"), passInput].forEach(el =>
            el.addEventListener("input", () => errorMessage.style.display = "none")
        );
    </script>
</body>

</html>
